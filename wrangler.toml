# Cloudflare Pages project config.
#
# If you connected the GitHub repo in the Cloudflare dashboard (the usual way),
# you do NOT need to edit this file: add the KV binding and ADMIN_PASSWORD
# secret under the project's Settings and every push redeploys.
#
# `npm run dev` passes its own local KV binding, so nothing here is required
# for local development either.

name = "hatamon-case"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# Only for deploying from your terminal with `npm run deploy`:
# run `npm run kv:create`, paste the id it prints below, and uncomment.
#
# [[kv_namespaces]]
# binding = "HATAMON"
# id = "paste-your-kv-namespace-id-here"
